services:
  db:
    image: postgres:16-alpine
    container_name: naicotech-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Só nesta máquina: na rede local, o banco ficaria exposto.
      - "127.0.0.1:5433:5432"
    volumes:
      - naicotech_pg_data:/var/lib/postgresql/data

  # Captura os e-mails enviados em dev. Caixa de entrada: http://localhost:8025
  mail:
    image: axllent/mailpit:v1.27
    container_name: naicotech-mailpit
    restart: unless-stopped
    ports:
      # Só nesta máquina: o Mailpit não tem senha e guarda os links de redefinição de senha.
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  naicotech_pg_data:
