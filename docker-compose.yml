services:
  db:
    image: postgres:16-alpine
    container_name: naicotech-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - naicotech_pg_data:/var/lib/postgresql/data

volumes:
  naicotech_pg_data:
